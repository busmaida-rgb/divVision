<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiehl's Heritage</title>
    <link rel="stylesheet" href="./css/about.css">
  </head>
  <body>
    <!-- 공용 header가 준비되면 이 위치에 연결하세요. -->

    <main class="about" id="main-content">
      <section class="about__section" aria-label="키엘 헤리티지 소개">
        <picture>
          <source media="(max-width: 768px)" srcset="./img/mo/about-mo-1.jpg">
          <source media="(max-width: 1024px)" srcset="./img/pad/about-pad-1.jpg">
          <img class="about__image" src="./img/pc/about-pc-1.jpg" alt="Kiehl's Heritage, A Legacy of Care" width="1920" height="801" fetchpriority="high">
        </picture>
      </section>

      <section class="about__section" aria-label="키엘의 시작">
        <picture>
          <source media="(max-width: 768px)" srcset="./img/mo/about-mo-2.jpg">
          <source media="(max-width: 1024px)" srcset="./img/pad/about-pad-2.jpg">
          <img class="about__image" src="./img/pc/about-pc-2.jpg" alt="1851, From Apothecary to Kiehl's" width="1920" height="824" loading="lazy" decoding="async">
        </picture>
      </section>

      <section class="about__section" aria-label="키엘의 초기 원칙">
        <picture>
          <source media="(max-width: 768px)" srcset="./img/mo/about-mo-3.jpg">
          <source media="(max-width: 1024px)" srcset="./img/pad/about-pad-3.jpg">
          <img class="about__image" src="./img/pc/about-pc-3.jpg" alt="처음부터 달랐던 키엘의 방식" width="1920" height="747" loading="lazy" decoding="async">
        </picture>
      </section>

      <section class="about__section" aria-label="헤리티지에서 포뮬러로">
        <picture>
          <source media="(max-width: 768px)" srcset="./img/mo/about-mo-4.jpg">
          <source media="(max-width: 1024px)" srcset="./img/pad/about-pad-4.jpg">
          <img class="about__image" src="./img/pc/about-pc-4.jpg" alt="From Heritage to Formula" width="1920" height="700" loading="lazy" decoding="async">
        </picture>
      </section>

      <section class="about__section" aria-label="키엘의 상징적인 순간들">
        <picture>
          <source media="(max-width: 768px)" srcset="./img/mo/about-mo-5.jpg">
          <source media="(max-width: 1024px)" srcset="./img/pad/about-pad-5.jpg">
          <img class="about__image" src="./img/pc/about-pc-5.jpg" alt="키엘을 만든 특별한 순간들" width="1920" height="937" loading="lazy" decoding="async">
        </picture>
      </section>

      <section class="about__section" aria-label="진화한 키엘의 헤리티지">
        <picture>
          <source media="(max-width: 768px)" srcset="./img/mo/about-mo-6.jpg">
          <source media="(max-width: 1024px)" srcset="./img/pad/about-pad-6.jpg">
          <img class="about__image" src="./img/pc/about-pc-6.jpg" alt="Heritage, Evolved" width="1920" height="700" loading="lazy" decoding="async">
        </picture>
      </section>

      <section class="about__section" aria-label="키엘의 변하지 않는 약속">
        <a href="#" class="about__link">
          <picture>
            <source media="(max-width: 768px)" srcset="./img/mo/about-mo-7.jpg">
            <source media="(max-width: 1024px)" srcset="./img/pad/about-pad-7.jpg">
            <img class="about__image" src="./img/pc/about-pc-7.jpg" alt="건강한 피부를 위한 키엘의 변하지 않는 약속" width="1920" height="700" loading="lazy" decoding="async">
          </picture>
        </a>
      </section>
    </main>

    <!-- 공용 footer가 준비되면 이 위치에 연결하세요. -->
  </body>
</html>
